<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Trợ lý</title>
  <desc>Speech bubble holding an amber sparkle — the app icon. Master vector;
        the raster icons are generated by tool/gen_logo.dart.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <!-- bubble body + tail curving out of its bottom-left -->
    <g id="bubble">
      <rect x="180" y="184" width="664" height="520" rx="200"/>
      <path d="M290 640 C300 740 280 800 236 842 C330 836 420 790 480 700 Z"/>
    </g>
  </defs>

  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#plate)"/>

  <use href="#bubble" y="18" fill="#101C3A" fill-opacity="0.25" filter="url(#shadow)"/>
  <use href="#bubble" fill="#FFFFFF"/>

  <!-- four-point sparkles: amber main, small blue accent -->
  <path fill="#F59E0B" d="M512 266 Q551.2 404.8 690 444 Q551.2 483.2 512 622 Q472.8 483.2 334 444 Q472.8 404.8 512 266 Z"/>
  <path fill="#2563EB" d="M700 238 Q713.6 286.4 762 300 Q713.6 313.6 700 362 Q686.4 313.6 638 300 Q686.4 286.4 700 238 Z"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Nhắc việc</title>
  <desc>Countdown ring around a clock face — the app icon. Master vector; the
        raster icons are generated by tool/gen_logo.dart.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" ry="230" fill="url(#plate)"/>

  <!-- full ring track -->
  <circle cx="512" cy="512" r="338" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="80"/>

  <!-- amber countdown arc: 200 degrees clockwise from 12 o'clock -->
  <path d="M512 174 A338 338 0 1 1 396.4 829.6"
        fill="none" stroke="#F59E0B" stroke-width="80" stroke-linecap="round"/>

  <!-- hands at 4 o'clock and 12 o'clock -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <path d="M512 512 L657.5 596" stroke-width="48"/>
    <path d="M512 512 L512 282" stroke-width="40"/>
  </g>
  <circle cx="512" cy="512" r="42" fill="#FFFFFF"/>
</svg>
